version: 2

project_name: clash-tui

before:
  hooks:
    - go mod tidy
    - go build ./...

builds:
  - id: clash-tui
    main: ./cmd/clash-tui
    binary: clash-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - AGENTS.md
      - docs/*

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: packages
    package_name: clash-tui
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/clash-tui/README.md
      - src: docs/IMPLEMENTATION.md
        dst: /usr/share/doc/clash-tui/IMPLEMENTATION.md

release:
  github:
    owner: lihy11
    name: Clash-TUI
